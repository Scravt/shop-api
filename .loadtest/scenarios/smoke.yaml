version: 1
name: smoke
description: Verificación rápida de los endpoints de lectura.
flows:
  main:
    steps:
      - name: health
        request: { method: GET, url: /health }
        source: { file: src/server.ts, operation_id: health }
      - name: list_products
        request: { method: GET, url: /products, query: { page: 1, limit: 20 } }
        source: { file: src/products.ts, operation_id: listProducts }
      - name: get_product
        request: { method: GET, url: /products/42 }
        source: { file: src/products.ts, operation_id: getProduct }
load:
  executor: constant_rate
  rate: 10/s
  duration: 10s
  max_vus: 20
