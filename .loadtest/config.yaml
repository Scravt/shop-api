version: 1
default_environment: local
environments:
  local:
    base_url: http://127.0.0.1:3000
    allowed_hosts: [127.0.0.1, localhost]
    limits:
      max_rps: 2000
      max_vus: 500
      max_duration: 10m

secrets:                  # valores en el entorno o en .env (no se versiona)
  - LT_USER
  - LT_PASSWORD
