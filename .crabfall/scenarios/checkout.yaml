version: 1
name: checkout
description: >
  Mezcla de tráfico de una tienda: la mayoría navega, algunos buscan y otros compran.
  Hace login una vez en setup y usa el token en todas las compras.
setup:
  - name: login
    request:
      method: POST
      url: /auth/login
      json: { user: "{{env.LT_USER}}", password: "{{env.LT_PASSWORD}}" }
    extract:
      token: { json: $.access_token }
    checks:
      - status: 200
    source: { file: src/auth.ts, symbol: login, operation_id: login }
defaults:
  headers: { Authorization: "Bearer {{token}}" }
flows:
  browse:
    weight: 70
    steps:
      - name: list_products
        request: { method: GET, url: /products, query: { page: "{{$randomInt(1,100)}}", limit: 20 } }
        source: { file: src/products.ts, operation_id: listProducts }
      - name: get_product
        request: { method: GET, url: "/products/{{$randomInt(1,50000)}}" }
        checks:
          - status: 200
          - { json: $.id, exists: true }
        source: { file: src/products.ts, operation_id: getProduct }
  search:
    weight: 10
    steps:
      - name: search_products
        request: { method: GET, url: /products/search, query: { q: lamp } }
        source: { file: src/products.ts, operation_id: searchProducts }
  buy:
    weight: 20
    steps:
      - name: create_order
        request:
          method: POST
          url: /orders
          json: { product_id: "{{$randomInt(1,50000)}}", quantity: 1, idempotency_key: "{{$uuid}}" }
        extract:
          order_id: { json: $.id }
        checks:
          - status: 201
          - { json: $.payment_id, matches: "^pay_" }
        tags: [write]
        source: { file: src/orders.ts, operation_id: createOrder }
      - name: get_order
        request: { method: GET, url: "/orders/{{order_id}}" }
        checks:
          - { json: $.id, equals: "{{order_id}}" }
        source: { file: src/orders.ts, operation_id: getOrder }
load:
  executor: constant_rate
  rate: 50/s
  duration: 30s
  max_vus: 100
  graceful_stop: 10s
thresholds:
  - { metric: http.latency.p95, lt: 100ms }
  - { metric: http.latency.p99, step: create_order, lt: 200ms }
  - { metric: http.error_rate, lt: 1% }
  - { metric: checks.pass_rate, gt: 99% }
